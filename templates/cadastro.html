{% extends 'base.html' %}{% block titulo %}Cadastro{% endblock %}{% block conteudo %}
<section class="small">
    <h1>Criar conta</h1>
    <form method="post" class="gridform">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Nome <input name="nome" required maxlength="120"></label>
        <label>E-mail <input type="email" name="email" required></label>
        <label>Senha (mínimo 8 caracteres) <input type="password" name="senha" minlength="8"
                required></label><button>Criar conta</button>
    </form>
    <p><a href="{{ url_for('auth.login') }}">Voltar ao login</a></p>
</section>{% endblock %}
